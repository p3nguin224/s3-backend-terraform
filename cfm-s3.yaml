AWSTemplateFormatVersion: 2010-09-09
Description: "Create backend s3 before initailizing terraform"
# Resources section
Resources:
  terraformBackendBucket: 
    Type: AWS::S3::Bucket
    Properties:
      BucketName: "thaw-terraform-backend-bucket"
      Tags: 
        - Key: "Environment"
          Value: "dev-Env"
        - Key: "Region"
          Value: ap-northeast-1

      VersioningConfiguration: 
        Status: Enabled

